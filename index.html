<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta http-equiv="cache-control" content="no-cache, no-store">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="css/main.css" rel="stylesheet" type="text/css" media="all">
    <title>楽譜閲覧</title>
    <!-- PDF.js ライブラリの読み込み -->
    <script src="https://cloudflare.com"></script>

    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; }
        .pdf-container {
            width: 100%;
            height: 800px;
            position: relative;
            border: 1px solid #ccc;
        }
        /* 透明なカバーを上にかぶせて、ドラッグや右クリックをガード */
        .pdf-cover {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0);
            z-index: 10;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
</head>
<body oncontextmenu="return false;"> <!-- 右クリックを禁止 -->

    <h1>【閲覧限定】資料ページ</h1>

    <div class="pdf-container">
        <div class="pdf-cover"></div>
        <!-- ここにPDF.jsのビューアーが展開されます -->
        <iframe id="pdfViewer" src=""></iframe>
    </div>

    <script>
        // PDF.jsのワーカーを設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';
        // 設定値の入力（あなたの環境に合わせて書き換えてください）
        const GITHUB_USERNAME = "mnwv";
        const REPO_NAME = "SheetMusic"; // 非公開リポジトリ名
        const FOLDER_PATH = "あ"; // フォルダ名
        const FILE_NAME = "あああうえのえき.ああ上野駅.pdf"; // ファイル名

        
        // ⚠️注意：このトークンは「Contents: Read-only」の最小権限（Fine-grained）で作成してください
        const REPO_TOKEN = "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"; 

        async function loadPrivatePDF() {
            // GitHub APIのURLを生成
            // 💡 ここを修正：GitHub APIの正しいURL形式にし、日本語をエンコードします
            const encodedPath = encodeURIComponent(`${FOLDER_PATH}/${FILE_NAME}`);
            const apiUrl = `https://github.com/${GITHUB_USERNAME}/${REPO_NAME}/contents/${encodedPath}`;
            
            try {
                // 非公開リポジトリからPDFデータを取得
                const response = await fetch(apiUrl, {
                    headers: {
                        "Authorization": `Bearer ${REPO_TOKEN}`,
                        "Accept": "application/vnd.github.raw"
                    }
                });

                if (!response.ok) {
                    throw new Error(`GitHub APIエラー: ${response.status} - 設定やトークンを確認してください。`);
                }

                const blob = await response.blob();
                const arrayBuffer = await blob.arrayBuffer();

                // PDFの読み込みとレンダリング処理
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const container = document.getElementById('pdf-pages-container');
                
                // 全ページをループして描画
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.5 }); // 拡大率（画質）

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    container.appendChild(canvas);

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;
                }

            } catch (error) {
                console.error(error);
                alert("ファイルの読み込み権限がないか、エラーが発生しました。");
            }
        }

        // キーボードショートカット（Ctrl+S, Ctrl+Pなど）による保存・印刷を禁止
        window.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'a')) {
                e.preventDefault();
                alert('このページでの保存・印刷は禁止されています。');
            }
        });

        // ページ読み込み時に実行
        loadPrivatePDF();
    </script>
</body>
</html>
